<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="0" y="0" width="1000" height="540" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="999" height="539" rx="18" fill="none" stroke="#dfe8e3"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#16352a">배선 · 전극 위치</text>
  <text x="32" y="68" font-size="13" fill="#5d6b63">모든 스케치 공통: BioAmp OUT → GPIO34 (ADC1). 수업 PPT처럼 VP(GPIO36)에 꽂았다면 ADC_PIN 한 줄만 36으로 바꾸면 됩니다.</text>

  <!-- ESP32 -->
  <rect x="40" y="100" width="210" height="330" rx="12" fill="#1f2a30"/>
  <rect x="98" y="118" width="94" height="58" rx="4" fill="#3a474f"/>
  <text x="145" y="152" font-size="13" fill="#cfd8dc" text-anchor="middle" font-family="monospace">ESP32</text>
  <text x="145" y="208" font-size="12" fill="#9fb0b8" text-anchor="middle">ESP32 Dev Module</text>
  <g font-size="12" font-family="monospace" fill="#e8f0ec">
    <circle cx="238" cy="250" r="6" fill="#e74c3c"/><text x="226" y="254" text-anchor="end">3V3</text>
    <circle cx="238" cy="282" r="6" fill="#2c3e50" stroke="#9fb0b8"/><text x="226" y="286" text-anchor="end">GND</text>
    <circle cx="238" cy="314" r="7" fill="#27ae60"/><text x="226" y="318" text-anchor="end" font-weight="700">GPIO34</text>
    <circle cx="238" cy="346" r="5" fill="#5d6b63"/><text x="226" y="350" text-anchor="end" fill="#9fb0b8">GPIO36 (VP)</text>
    <circle cx="238" cy="378" r="5" fill="#5d6b63"/><text x="226" y="382" text-anchor="end" fill="#9fb0b8">GPIO39 (VN)</text>
  </g>
  <rect x="120" y="430" width="50" height="22" rx="4" fill="#9fb0b8"/>
  <text x="145" y="478" font-size="12" fill="#5d6b63" text-anchor="middle">USB → PC</text>
  <text x="145" y="496" font-size="11" fill="#8fa59a" text-anchor="middle">115200 baud (EMG 250000)</text>
  <text x="262" y="398" font-size="11" fill="#8fa59a">← 9주차 EMG 2채널</text>

  <!-- wires -->
  <path d="M244 250 C 300 250, 320 230, 392 230" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <path d="M244 282 C 300 282, 330 266, 392 266" fill="none" stroke="#2c3e50" stroke-width="3"/>
  <path d="M245 314 C 300 314, 330 302, 392 302" fill="none" stroke="#27ae60" stroke-width="3.5"/>

  <!-- BioAmp -->
  <rect x="392" y="190" width="170" height="150" rx="10" fill="#6d2e9e"/>
  <text x="477" y="214" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">BioAmp EXG Pill</text>
  <g font-size="12" font-family="monospace" fill="#f3e9fb">
    <text x="404" y="234">VCC</text><text x="404" y="270">GND</text><text x="404" y="306">OUT</text>
    <text x="550" y="234" text-anchor="end">IN+</text><text x="550" y="270" text-anchor="end">IN−</text><text x="550" y="306" text-anchor="end">REF</text>
  </g>
  <text x="477" y="330" font-size="10.5" fill="#d9c6ea" text-anchor="middle">3.3 V 구동 · 차동 증폭</text>

  <!-- electrode leads -->
  <path d="M562 230 C 600 230, 610 160, 640 160" fill="none" stroke="#e07b24" stroke-width="2.5"/>
  <path d="M562 266 C 600 266, 610 200, 640 200" fill="none" stroke="#2f80c9" stroke-width="2.5"/>
  <path d="M562 302 C 580 302, 570 240, 640 240" fill="none" stroke="#8fa59a" stroke-width="2.5"/>
  <g font-size="12" font-weight="700"><circle cx="648" cy="160" r="7" fill="#e07b24"/><circle cx="648" cy="200" r="7" fill="#2f80c9"/><circle cx="648" cy="240" r="7" fill="#8fa59a"/></g>
  <g font-size="12" fill="#2b3a33"><text x="662" y="164">IN+</text><text x="662" y="204">IN−</text><text x="662" y="244">REF</text></g>

  <!-- electrode table -->
  <g font-size="12" fill="#2b3a33">
    <rect x="588" y="270" width="392" height="236" rx="10" fill="#f4f8f5" stroke="#dfe8e3"/>
    <text x="602" y="296" font-weight="700" fill="#16352a">신호</text>
    <text x="646" y="296" font-weight="700" fill="#e07b24">IN+</text>
    <text x="760" y="296" font-weight="700" fill="#2f80c9">IN−</text>
    <text x="876" y="296" font-weight="700" fill="#5d6b63">REF</text>
    <line x1="600" y1="306" x2="968" y2="306" stroke="#dfe8e3"/>
    <text x="602" y="332" font-weight="700">ECG</text><text x="646" y="332">왼쪽 쇄골 아래</text><text x="760" y="332">오른쪽 쇄골 아래</text><text x="876" y="332">왼쪽 갈비뼈 아래</text>
    <text x="646" y="348" fill="#8fa59a" font-size="11">(또는 왼손목)</text><text x="760" y="348" fill="#8fa59a" font-size="11">(또는 오른손목)</text><text x="876" y="348" fill="#8fa59a" font-size="11">(또는 오른발목)</text>
    <text x="602" y="380" font-weight="700">EEG</text><text x="646" y="380">이마 왼쪽</text><text x="760" y="380">이마 오른쪽</text><text x="876" y="380">귓불·귀 뒤</text>
    <text x="646" y="396" fill="#8fa59a" font-size="11">(눈썹 위 3~4 cm)</text><text x="760" y="396" fill="#8fa59a" font-size="11">(3~4 cm 간격)</text>
    <text x="602" y="428" font-weight="700">EMG</text><text x="646" y="428">이두근 배 위</text><text x="760" y="428">근육 방향 2 cm 옆</text><text x="876" y="428">팔꿈치 뼈</text>
    <text x="602" y="468" font-weight="700">EOG</text><text x="646" y="468">왼쪽 눈꼬리 바깥</text><text x="760" y="468">오른쪽 눈꼬리 바깥</text><text x="876" y="468">이마 가운데</text>
    <text x="646" y="484" fill="#8fa59a" font-size="11">수평 안구 운동</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
